<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محرّر منتجات JOX</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#262b36;--txt:#e7ebf0;--mut:#9aa4b2;--acc:#22c55e;--acc2:#3b82f6;--warn:#f59e0b}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt)}
#gate{position:fixed;inset:0;background:#0b0d10;display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:14px}
#gate input{padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:#12151b;color:#fff;font-size:16px;text-align:center;width:240px}
#gate button{padding:11px 26px;border:0;border-radius:10px;background:var(--acc);color:#05210f;font-weight:700;font-size:15px;cursor:pointer}
.hidden{display:none!important}
header{position:sticky;top:0;background:#12151bdd;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;z-index:20}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar input[type=search],.bar select{padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:#12151b;color:#fff;font-size:14px}
.bar input[type=search]{flex:1;min-width:180px}
.btn{padding:9px 14px;border:0;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;color:#fff}
.btn.g{background:var(--acc);color:#05210f}.btn.b{background:var(--acc2)}.btn.o{background:#2a2f3a}
.stat{color:var(--mut);font-size:13px;margin-inline-start:auto}
.wrap{max-width:1200px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;display:grid;grid-template-columns:150px 1fr;gap:14px}
.card.mod{border-color:var(--acc)}
.thumb{width:150px;height:150px;object-fit:contain;background:#fff;border-radius:10px}
.f{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{font-size:12px;color:var(--mut)}
.in{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#12151b;color:#fff;font-size:14px;width:100%}
textarea.in{min-height:60px;resize:vertical;font-family:inherit;line-height:1.5}
.price{width:110px}
.badge{font-size:11px;background:#2a2f3a;color:#cbd5e1;padding:3px 8px;border-radius:20px}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:4px}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:center}
th{background:#12151b;color:var(--mut);font-weight:600}
td .in{padding:5px 7px;font-size:12px}
.sku{width:130px}
.av{display:flex;gap:6px;align-items:center;justify-content:center;cursor:pointer;user-select:none;font-size:12px;font-weight:700}
.av .dot{width:11px;height:11px;border-radius:50%;background:#ef4444}
.av.on .dot{background:var(--acc)}
.av.on{color:var(--acc)}.av:not(.on){color:#ef4444}
.toast{position:fixed;bottom:16px;inset-inline-start:16px;background:#05210f;color:var(--acc);border:1px solid var(--acc);padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;z-index:50}
.toast.show{opacity:1}
.name{font-weight:700;font-size:15px}
small.k{color:#5b6472;font-size:11px}
@media(max-width:680px){.card{grid-template-columns:1fr}.thumb{width:100%;height:200px}}
</style>
</head>
<body>
<div id="gate">
  <div style="font-size:22px;font-weight:800">🔒 محرّر منتجات JOX</div>
  <div style="color:#9aa4b2;font-size:14px">اكتب كلمة السر للدخول</div>
  <input id="pw" type="password" placeholder="كلمة السر" onkeydown="if(event.key==='Enter')tryPw()">
  <button onclick="tryPw()">دخول</button>
  <div id="pwerr" style="color:#ef4444;font-size:13px;height:16px"></div>
</div>

<div id="app" class="hidden">
<header>
  <div class="bar">
    <input id="q" type="search" placeholder="🔍 دوّر باسم المنتج أو الكود..." oninput="render()">
    <select id="cat" onchange="render()"></select>
    <select id="modf" onchange="render()">
      <option value="all">الكل</option><option value="mod">المعدّلة بس</option>
    </select>
    <button class="btn g" onclick="exportJSON()">⬇️ تصدير الملف المكتمل</button>
    <button class="btn b" onclick="document.getElementById('imp').click()">📂 استيراد</button>
    <button class="btn o" onclick="linkFile()">🔗 ربط بملف (حفظ تلقائي)</button>
    <input id="imp" type="file" accept=".json" class="hidden" onchange="importJSON(event)">
    <span class="stat" id="stat"></span>
  </div>
</header>
<div class="wrap" id="list"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const PASSWORD = "jox2026"; // غيّرها من الملف لو حبيت
const PRODUCTS = JSON.parse(document.getElementById('data').textContent);
let EDITS = {};
try{EDITS=JSON.parse(localStorage.getItem('jox_edits')||'{}')}catch(e){}
let fileHandle=null;

function tryPw(){
  if(document.getElementById('pw').value===PASSWORD){
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    initCats(); render();
  } else { document.getElementById('pwerr').textContent='كلمة السر غلط'; }
}
function initCats(){
  const cats=[...new Set(PRODUCTS.map(p=>p.category))];
  const s=document.getElementById('cat'); s.innerHTML='<option value="all">كل الأقسام</option>'+cats.map(c=>'<option>'+c+'</option>').join('');
}
function val(p,f){const e=EDITS[p.id];return e&&e[f]!==undefined?e[f]:p[f];}
function variant(p,key){const e=EDITS[p.id]&&EDITS[p.id].variants&&EDITS[p.id].variants[key]||{};return {sku:e.sku!==undefined?e.sku:(p.skuMap[key]||''),available:e.available!==undefined?e.available:true};}
function isMod(p){return !!EDITS[p.id];}
function combos(p){const cs=p.colors.length?p.colors.map(c=>c.name):[''];const ss=p.sizes.length?p.sizes:[''];const o=[];for(const c of cs)for(const s of ss)o.push({color:c,size:s,key:c+'|'+s});return o;}

function setEdit(id,f,v){EDITS[id]=EDITS[id]||{};EDITS[id][f]=v;persist();markCard(id);}
function setVar(id,key,f,v){EDITS[id]=EDITS[id]||{};EDITS[id].variants=EDITS[id].variants||{};EDITS[id].variants[key]=EDITS[id].variants[key]||{};EDITS[id].variants[key][f]=v;persist();markCard(id);}
function persist(){localStorage.setItem('jox_edits',JSON.stringify(EDITS));updateStat();if(fileHandle)writeFile();toast('💾 اتحفظ');}
function markCard(id){const c=document.getElementById('c_'+id);if(c)c.classList.add('mod');}
function updateStat(){document.getElementById('stat').textContent='معدّل: '+Object.keys(EDITS).length+' / '+PRODUCTS.length+' منتج';}

let tT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),900);}

function render(){
  const q=(document.getElementById('q').value||'').trim().toLowerCase();
  const cat=document.getElementById('cat').value;
  const mf=document.getElementById('modf').value;
  const list=document.getElementById('list');
  const items=PRODUCTS.filter(p=>{
    if(cat!=='all'&&p.category!==cat)return false;
    if(mf==='mod'&&!isMod(p))return false;
    if(q){const hay=(val(p,'name')+' '+p.key+' '+JSON.stringify(EDITS[p.id]||'')).toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
  list.innerHTML=items.map(cardHTML).join('')||'<p style="color:#9aa4b2">مفيش نتايج</p>';
  updateStat();
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function cardHTML(p){
  const rows=combos(p).map(cb=>{
    const v=variant(p,cb.key);
    return '<tr><td>'+(cb.color||'—')+'</td><td>'+(cb.size||'—')+'</td>'+
      '<td><input class="in sku" value="'+esc(v.sku)+'" placeholder="SKU" onchange="setVar(\''+p.id+'\',\''+cb.key.replace(/'/g,"\\'")+'\',\'sku\',this.value)"></td>'+
      '<td><span class="av '+(v.available?'on':'')+'" onclick="toggleAv(this,\''+p.id+'\',\''+cb.key.replace(/'/g,"\\'")+'\')"><span class="dot"></span>'+(v.available?'متوفر':'مش متوفر')+'</span></td></tr>';
  }).join('');
  return '<div class="card'+(isMod(p)?' mod':'')+'" id="c_'+p.id+'">'+
    '<div><img class="thumb" loading="lazy" src="'+esc(p.thumb)+'"><div style="margin-top:6px"><span class="badge">'+esc(p.category)+'</span></div><small class="k">'+esc(p.key)+'</small></div>'+
    '<div class="f">'+
      '<input class="in name" value="'+esc(val(p,'name'))+'" onchange="setEdit(\''+p.id+'\',\'name\',this.value)">'+
      '<div class="row"><div><label>السعر</label><br><input class="in price" type="number" value="'+esc(val(p,'price'))+'" onchange="setEdit(\''+p.id+'\',\'price\',Number(this.value))"></div></div>'+
      '<div><label>الوصف</label><textarea class="in" onchange="setEdit(\''+p.id+'\',\'description\',this.value)">'+esc(val(p,'description'))+'</textarea></div>'+
      '<table><thead><tr><th>اللون</th><th>المقاس</th><th>SKU (كود المنتج)</th><th>التوفّر</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '</div></div>';
}
function toggleAv(el,id,key){const now=!el.classList.contains('on');el.classList.toggle('on',now);el.innerHTML='<span class="dot"></span>'+(now?'متوفر':'مش متوفر');setVar(id,key,'available',now);}

function merged(){return PRODUCTS.map(p=>({id:p.id,key:p.key,category:p.category,thumb:p.thumb,name:val(p,'name'),price:val(p,'price'),description:val(p,'description'),variants:combos(p).map(cb=>{const v=variant(p,cb.key);return {color:cb.color,size:cb.size,sku:v.sku,available:v.available};})}));}
function exportJSON(){const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),products:merged()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jox-products-filled.json';a.click();toast('⬇️ اتصدّر');}
function importJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);const arr=d.products||d;EDITS={};for(const p of arr){const orig=PRODUCTS.find(x=>x.id===p.id||x.key===p.key);if(!orig)continue;const e={};if(p.name!==orig.name)e.name=p.name;if(Number(p.price)!==Number(orig.price))e.price=Number(p.price);if(p.description!==orig.description)e.description=p.description;const vars={};for(const v of(p.variants||[])){const key=v.color+'|'+v.size;const def=variant(orig,key);const o={};if(v.sku!==(orig.skuMap[key]||''))o.sku=v.sku;if(v.available!==true)o.available=v.available;if(Object.keys(o).length)vars[key]=o;}if(Object.keys(vars).length)e.variants=vars;if(Object.keys(e).length)EDITS[p.id||orig.id]=e;}persist();render();toast('📂 اتحمّل');}catch(err){alert('ملف غير صالح');}};r.readAsText(f);}
async function linkFile(){try{fileHandle=await window.showSaveFilePicker({suggestedName:'jox-products-filled.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]});await writeFile();toast('🔗 اتربط — هيحفظ تلقائي');}catch(e){alert('المتصفح مش داعم الميزة دي — استخدم زر التصدير. (Chrome/Edge بس)');}}
async function writeFile(){try{const w=await fileHandle.createWritable();await w.write(JSON.stringify({exportedAt:new Date().toISOString(),products:merged()},null,2));await w.close();}catch(e){}}
window.addEventListener('DOMContentLoaded',()=>{document.getElementById('pw').focus();});
</script>
</body></html>
